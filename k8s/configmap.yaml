apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate
data:
  SHARD_SIZE: '25'
  SHARDS_MIN: '1'
  SHARDS_MAX: '4'
  TZ: 'Europe/Berlin'
  #LOG_LEVEL: 'debug'
  LOG_FORMAT: 'pretty'
  RENOVATE_TIMEZONE: 'Europe/Berlin'
  RENOVATE_PLATFORM: 'github'
  RENOVATE_BASE_DIR: '/tmp/renovate'
  RENOVATE_PERSIST_REPO_DATA: 'true'
  RENOVATE_REPOSITORY_CACHE: 'enabled'
  RENOVATE_GIT_AUTHOR: 'Florian Hübner <fhuebner@posteo.de>'
  RENOVATE_AUTODISCOVER: 'true'
  RENOVATE_AUTODISCOVER_FILTER: 'nothub/*'
  RENOVATE_ABANDONMENT_THRESHOLD: '1 year'
  RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
  RENOVATE_PR_CONCURRENT_LIMIT: '10'
  RENOVATE_PR_HOURLY_LIMIT: '10'
  RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["goGenerate", "gradleWrapper", "mise"]'
  REPO_OVERRIDES: '{"nothub/infra": {"allowedCommands": ["^\\./scripts/sync-k8s-versions\\.sh$"]}, "nothub/ts3-docker": {"allowedCommands": ["^\\./update-checksum\\.sh$"]}}'
