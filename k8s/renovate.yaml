apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The image runs as uid 12021, fsGroup makes the volume writable for it.
            fsGroup: 12021
          containers:
            - name: renovate
              image: renovate/renovate:full
              imagePullPolicy: Always
              # args, not command: command would replace the image entrypoint that sets up the tool environment.
              args: ['node', '/opt/renovate-sharded/shard.mjs']
              envFrom:
                - configMapRef:
                    name: renovate
                - secretRef:
                    name: renovate
              volumeMounts:
                - name: cache
                  mountPath: /tmp/renovate
                - name: script
                  mountPath: /opt/renovate-sharded
                  readOnly: true
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: renovate
            - name: script
              configMap:
                name: renovate-sharded
